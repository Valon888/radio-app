<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Mini IPTV + Radio: kanale TV dhe radio live me rilidhje automatike dhe burime rezervë.">
<title>Mini IPTV + Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
<script src="js/diagnostics.js"></script>
</head>
<body>
<a class="skip-link" href="#channelList">Kalo te lista e kanaleve</a>

<header class="topbar">
  <div class="brand">
    <img src="icons/icon.svg" alt="" width="32" height="32">
    <span>Mini IPTV</span>
  </div>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Kërko kanal…  ( / )" aria-label="Kërko kanal" autocomplete="off">
  </div>

  <button id="filtersBtn" class="btn filters-btn" type="button" aria-expanded="false" aria-controls="filters">Filtra</button>

  <nav class="tabs" id="tabs" aria-label="Kategoritë">
    <button class="tab active" data-tab="all">Të gjitha</button>
    <button class="tab" data-tab="tv">TV</button>
    <button class="tab" data-tab="radio">Radio</button>
    <button class="tab" data-tab="favorites">★ Të preferuarat</button>
    <button class="tab" data-tab="history">Historiku</button>
  </nav>

  <div class="filters" id="filters">
    <select id="countrySelect" aria-label="Shteti"></select>
    <select id="groupSelect" aria-label="Grupi"></select>

    <label class="toggle" title="Fshih kanalet që dështuan në test">
      <input type="checkbox" id="hideOffline">
      <span>Fshih offline</span>
    </label>

    <button id="testBtn" class="btn" title="Testo kanalet e listës aktuale">Testo kanalet</button>
    <button id="installBtn" class="btn" hidden>Instalo</button>
  </div>
</header>

<div class="layout">
  <main class="stage" aria-label="Luajtësi">
    <div class="screen" id="screen">
      <video id="video" playsinline controlslist="nodownload"></video>
      <audio id="audio" preload="none"></audio>
      <div class="logo-mask" id="logoMask" hidden aria-hidden="true"><img src="icons/icon.svg" alt=""><span>Mini IPTV</span></div>

      <div class="radio-art" id="radioArt" hidden>
        <img id="radioLogo" alt="" referrerpolicy="no-referrer">
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-box">
          <div class="spinner" id="spinner" hidden></div>
          <div class="overlay-title" id="overlayTitle"></div>
          <div class="overlay-text" id="overlayText"></div>
          <div class="overlay-actions" id="overlayActions" hidden>
            <button class="btn primary" id="retryBtn">Provo përsëri</button>
            <button class="btn" id="altSourceBtn">Burimi tjetër</button>
            <button class="btn" id="nextChannelBtn">Kanal tjetër</button>
          </div>
        </div>
      </div>

      <div class="chan-number" id="chanNumber" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <div class="controls" id="controls">
      <button class="icon-btn" id="prevBtn" title="Kanali i mëparshëm (←)" aria-label="Kanali i mëparshëm">⏮</button>
      <button class="icon-btn" id="playBtn" title="Luaj/Pauzë (Hapësirë)" aria-label="Luaj ose pauzë">▶</button>
      <button class="icon-btn" id="nextBtn" title="Kanali tjetër (→)" aria-label="Kanali tjetër">⏭</button>

      <button class="icon-btn" id="muteBtn" title="Pa zë (M)" aria-label="Pa zë">🔊</button>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volumi">

      <span class="spacer"></span>

      <label class="select-label">Cilësia
        <select id="qualitySelect" aria-label="Cilësia">
          <option value="0">Auto</option>
        </select>
      </label>
      <button class="icon-btn" id="starBtn" title="Shto te të preferuarat (S)" aria-label="Të preferuarat">☆</button>
      <button class="icon-btn" id="castBtn" title="Cast / AirPlay" aria-label="Cast" hidden>📡</button>
      <button class="icon-btn" id="pipBtn" title="Picture-in-Picture (P)" aria-label="Picture in Picture" hidden>🗗</button>
      <button class="icon-btn" id="fsBtn" title="Ekran i plotë (F)" aria-label="Ekran i plotë">⛶</button>
    </div>

    <section class="now" aria-live="polite">
      <div class="now-title">
        <img id="nowLogo" alt="" referrerpolicy="no-referrer" hidden>
        <div>
          <h1 id="nowName">Zgjidh një kanal</h1>
          <div class="now-sub" id="nowSub"></div>
        </div>
      </div>
      <div class="now-stats">
        <span class="signal" id="signal" title="Sinjali">
          <i></i><i></i><i></i><i></i>
        </span>
        <span id="statusText" class="status-text">Gati</span>
        <span id="statsText" class="muted"></span>
      </div>
      <div class="epg" id="epg" hidden>
        <div><b>Tani:</b> <span id="epgNow"></span></div>
        <div class="muted"><b>Më pas:</b> <span id="epgNext"></span></div>
      </div>
    </section>

    <p class="help muted">
      Tastet: ↑/↓ zgjidh, Enter luaj, numrat kalim i shpejtë, ←/→ kanal, F ekran i plotë,
      M pa zë, P PiP, S e preferuar, N burim tjetër, R provo përsëri, / kërko.
    </p>
  </main>

  <aside class="channels" aria-label="Lista e kanaleve">
    <div class="list-head">
      <span id="countText">0 kanale</span>
      <span id="healthText" class="muted"></span>
    </div>
    <div class="progress" id="healthProgress" hidden><div></div></div>
    <ul class="channel-list" id="channelList" role="listbox" tabindex="0" aria-label="Kanalet"></ul>
  </aside>
</div>

<noscript>Ky aplikacion kërkon JavaScript.</noscript>
<script type="module" src="js/mobile.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
